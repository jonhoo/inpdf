[package]
name = "inpdf"
version = "0.1.2"
edition = "2021"

[profile.release]
debug = true

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
lopdf = "0.42" # https://github.com/jrmuizel/pdf-extract/issues/135
memmap2 = "0.9.9"
papaya = "0.2.3"
pdf-extract = "0.12.0"
regex = "1.12.2"
rmcp = { version = "1.8", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
walkdir = "2.5.0"
